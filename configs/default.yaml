model:
  n_layers: 6
  d_model: 512
  d_k: 64
  d_v: 64
  d_ff: 2048
  n_heads: 8
  dropout_prob: 0.1
  max_padding: 56

training:
  batch_size: 32
  shuffle: true
  dynamic_batching: false
  max_updates: 24000
  eval_every: 1000
  learning_rate:
    base: 1.0
    warmup_steps: 3000
  accumulation_steps: 10
  random_seed: 42
  label_smoothing: 0.1

dataset:
  name: "toy"
  language_pair: ["de", "en"]
  size: 10000
  probe_size: 10000
  split_seed: 42

logging:
  artifacts_dir: "artifacts"

hardware:
  device: "cuda"
  data_parallel: false

translation:
  batch_limit: 1000

extras: {}
